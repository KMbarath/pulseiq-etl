name: ETL CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: cp .env.example .env

      - name: Validate Compose configuration
        run: docker compose -f compose.yaml config

      - name: Build ETL image
        run: docker build --tag pulseiq-etl:ci .

      - name: Run ETL smoke test
        run: |
          docker run --rm \
            --env RAW_DIR=data/raw \
            --env CLEAN_DIR=data/clean \
            --env REJECTED_DIR=data/rejected \
            --env LOG_DIR=logs \
            --env ETL_AS_OF_DATE=2026-10-12 \
            --env FAIL_ON_REJECTS=true \
            --volume "${{ github.workspace }}/data:/app/data" \
            --volume "${{ github.workspace }}/logs:/app/logs" \
            pulseiq-etl:ci

      - name: Verify smoke-test outputs
        shell: bash
        run: |
          set -euo pipefail
          for table in employees salaries attendance leave payroll; do
            test -s "data/clean/${table}.csv"
            test -f "data/rejected/${table}_rejected.csv"
          done
          test -n "$(find logs -name 'run_*.json' -print -quit)"
